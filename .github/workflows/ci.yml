name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The AppHost normally takes DCP and the dashboard from the local Aspire CLI bundle (~/.aspire/bundle). CI has no
  # CLI installed, so restore them from NuGet instead.
  BUILD_ARGS: -c Release -p:AspireUseCliBundle=false

jobs:
  test:
    name: Unit and integration tests
    # QuarterHour is a Windows app (Outlook COM, DPAPI, win-x64 publish) and the integration tests use Windows paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build QuarterHour.slnx ${{ env.BUILD_ARGS }}

      - name: Unit tests
        run: dotnet test --project tests/QuarterHour.Core.Tests ${{ env.BUILD_ARGS }} --no-build

      - name: Integration tests
        run: dotnet test --project tests/QuarterHour.IntegrationTests ${{ env.BUILD_ARGS }} --no-build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: TestResults/
          if-no-files-found: ignore

  end-to-end:
    name: End-to-end tests (Aspire + Playwright)
    # Linux runners can trust the ASP.NET Core dev certificate without a prompt; Windows asks interactively.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate the sample calendar
        run: python samples/make-sample-calendar.py

      - name: Check the committed sample calendar is up to date
        run: git diff --exit-code samples/ || { echo "::error::samples/november-2026.ics is out of date. Run python samples/make-sample-calendar.py and commit the result."; exit 1; }

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build tests/QuarterHour.EndToEndTests ${{ env.BUILD_ARGS }}

      - name: Install Chromium for Playwright
        run: pwsh tests/QuarterHour.EndToEndTests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      - name: Trust the HTTPS development certificate
        # Aspire's health check calls the app over HTTPS. On Linux, .NET trusts the dev cert through SSL_CERT_DIR.
        run: |
          dotnet dev-certs https --trust || true
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: End-to-end tests
        run: dotnet test --project tests/QuarterHour.EndToEndTests ${{ env.BUILD_ARGS }} --no-build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-end-to-end
          path: TestResults/
          if-no-files-found: ignore
